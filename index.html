<!doctype html>
<html lang="en" class="h-full bg-zinc-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DaisyCal</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Philosopher:wght@400;700&family=Mulish:wght@300..800&family=Bricolage+Grotesque:opsz,wght@12..96,300..400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full text-gray-900 antialiased">
    <script>
      // Dark mode before the app loads (no light flash); useTheme() keeps it in step afterwards.
      try {
        var theme = (JSON.parse(localStorage.getItem('daisycal.layout') || '{}') || {}).theme
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
